[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studymate-api"
version = "0.1.0"
description = "StudyMate course material RAG and review backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "SQLAlchemy==2.0.41",
  "alembic==1.16.1",
  "pydantic-settings==2.9.1",
  "PyJWT==2.10.1",
  "bcrypt==4.3.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "PyMuPDF==1.26.1",
  "python-pptx==1.0.2",
  "openai==1.82.0",
  "requests==2.32.4",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.0",
  "pytest-cov==6.2.1",
  "ruff==0.11.13",
  "mypy==1.16.0",
  "types-PyYAML",
  "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
